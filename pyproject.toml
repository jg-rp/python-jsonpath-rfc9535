[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsonpath-rfc9535"
dynamic = ["version"]
description = 'RFC 9535 - JSONPath: Query Expressions for JSON in Python'
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []

authors = [
    { name = "James Prior", email = "jamesgr.prior@gmail.com" }
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = ["regex", "iregexp-check>=0.1.4"]

[project.urls]
Documentation = "https://jg-rp.github.io/python-jsonpath-rfc9535/"
Issues = "https://github.com/jg-rp/python-jsonpath-rfc9535/issues"
Source = "https://github.com/jg-rp/python-jsonpath-rfc9535"

[project.scripts]
jsonpath-rfc9535 = "jsonpath_rfc9535.cli:main"

[tool.hatch.version]
path = "src/jsonpath_rfc9535/__about__.py"

[tool.hatch.envs.default]
dependencies = [
    "furo",
    "mypy>=2.3.1",
    "pyperf>=2.10.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "sphinx>=9.1.0",
    "types-regex>=2026.8.31.20260901",
]

[tool.hatch.envs.benchmark]
template = "default"
extra-dependencies = [
    "msgspec",
    "memray",
]


[tool.hatch.envs.default.scripts]
cov = "pytest --cov=jsonpath_rfc9535 tests/"
docs-build = "sphinx-build -d .doctrees -b html docs site --fail-on-warning {args}"
test = "pytest {args}"
lint = "ruff check ."
typing = "mypy src"


[[tool.hatch.envs.all.matrix]]
python = ["3.12", "3.13", "3.14"]
